<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hasbifx</title>
<meta name="theme-color" content="#3b3bff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#3b3bff;--ink:#14122b;--paper:#fff;--c1:#ffd23f;--c2:#ff6fb5;--c3:#35e0a1;--c4:#7fd4ff;--ease:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100svh;overflow-x:hidden;background:var(--bg);color:#fff;font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(rgba(255,255,255,.22) 1.5px,transparent 1.7px) 0 0/26px 26px;animation:drift 3s linear infinite;pointer-events:none}
@keyframes drift{to{background-position:26px 26px}}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--c1);outline-offset:4px}

/* bentuk melayang di latar */
.sh{position:fixed;z-index:0;pointer-events:none;transform:rotate(var(--r,0deg));animation:bob 7s ease-in-out infinite}
.sh1{width:64px;height:64px;border-radius:50%;background:var(--c2);border:2.5px solid var(--ink);top:22%;left:-18px}
.sh2{width:48px;height:48px;background:var(--c3);border:2.5px solid var(--ink);top:44%;right:-10px;--r:20deg;animation-delay:-2s}
.sh3{width:78px;height:78px;background:var(--c1);bottom:12%;left:5%;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation-delay:-4s}
.sh4{width:92px;height:92px;border-radius:50%;border:12px solid var(--c4);bottom:6%;right:4%;animation-delay:-1s}
@keyframes bob{50%{transform:translateY(-24px) rotate(calc(var(--r,0deg) + 25deg))}}

/* pita berjalan */
.marq{position:relative;z-index:2;margin:24px 0 0 -3%;width:106%;overflow:hidden;background:var(--c1);color:var(--ink);border-block:2.5px solid var(--ink);transform:rotate(-1.4deg);font-weight:800;font-size:15px;padding:7px 0}
.track{display:flex;width:max-content;animation:mq 28s linear infinite}
.track span{padding-right:28px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}

main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:14px 20px 48px}
.top{display:flex;justify-content:flex-end;margin-bottom:-30px}
header{text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.88) rotate(-3deg)}}

/* avatar + teks melingkar */
.av{position:relative;width:200px;height:200px;margin:0 auto;animation:pop .8s var(--ease) .1s backwards}
.ring{position:absolute;inset:0;width:100%;height:100%;fill:#fff;font:800 15px 'Bricolage Grotesque',system-ui,sans-serif;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pic{position:absolute;inset:36px;border-radius:50%;overflow:hidden;border:3px solid var(--ink);background:#0a0a0a;box-shadow:5px 5px 0 var(--ink);transition:transform .4s var(--ease)}
.av:hover .pic{transform:rotate(-6deg) scale(1.06)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ini{width:100%;height:100%;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--ink);background:var(--c2)}

h1{margin-top:10px;font-size:34px;font-weight:800;letter-spacing:-.02em;animation:pop .7s var(--ease) .22s backwards}
.ver{width:26px;height:26px;vertical-align:-3px;margin-left:6px}
.bio{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:10px;background:var(--ink);color:var(--c1);font-weight:700;font-size:16px;transform:rotate(-1.5deg);animation:pop .7s var(--ease) .32s backwards}
#bio{min-height:1.3em;display:inline-block}
#bio::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:currentColor;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* tombol sosmed */
.socs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px 0 30px}
.soc{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:50%;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;animation:pop .6s var(--ease) backwards;animation-delay:calc(.4s + var(--i,0)*.06s)}
.soc svg{width:22px;height:22px}
.soc:hover{transform:translate(-2px,-2px) rotate(-8deg);box-shadow:5px 5px 0 var(--ink)}
.soc:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

/* kartu link */
.links{display:grid;gap:18px}
.link{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--paper);color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:pop .6s var(--ease) backwards;animation-delay:calc(.55s + var(--i)*.07s)}
.link:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:8px 8px 0 var(--ink)}
.link:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.link.hot{background:var(--c1)}
.ico{flex:none;display:grid;place-items:center;width:46px;height:46px;font-size:22px;background:var(--bc);border:2.5px solid var(--ink);border-radius:12px;transition:transform .3s var(--ease)}
.link:hover .ico{transform:rotate(-10deg) scale(1.1)}
.tx{display:grid;gap:2px;min-width:0}
.tx b{font-size:17px;font-weight:800;line-height:1.2}
.tx small{font-size:13.5px;font-weight:500;opacity:.72;line-height:1.3}
.go{flex:none;width:22px;height:22px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.link:hover .go{transform:translateX(5px)}
.tag{position:absolute;top:-13px;right:16px;padding:2px 11px;border-radius:99px;background:var(--c2);color:var(--ink);border:2.5px solid var(--ink);font-style:normal;font-weight:800;font-size:12px;transform:rotate(4deg);animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.1)}}

footer{margin-top:38px;text-align:center;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.88)}
.toast{position:fixed;left:50%;bottom:24px;z-index:9;padding:10px 18px;border-radius:12px;background:var(--ink);color:#fff;border:2.5px solid #fff;font-weight:700;transform:translate(-50%,120px);transition:transform .4s var(--ease)}
.toast.on{transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============================================================
     EDIT BAGIAN INI SAJA: ubah teks, link, warna, dan gambar
     ============================================================ -->
<script>
const CONFIG = {
  nama: "hasbifx",
  verified: true,                       // true = tampilkan centang, false = sembunyikan
  foto: "hasbifx.png",                             // URL foto profil (mis. "foto.jpg"). Kosongkan = pakai inisial nama
  bio: ["Traders", "Creator", "WebDev"],   // teks yang diketik bergantian
  badge: "Selamat datang",              // teks yang berputar mengelilingi foto
  marquee: ["hasbifx", "hasbifx", "hasbifx"],

  warna: {
    latar: "#3b3bff",                   // warna latar halaman
    tinta: "#14122b",                   // warna garis & bayangan
    aksen: ["#ffd23f", "#ff6fb5", "#35e0a1", "#7fd4ff"]   // 4 warna aksen (harus 4)
  },

  // ikon yang tersedia: instagram, facebook, x, youtube, tiktok, linkedin, telegram, whatsapp, email, web
  sosmed: [
    { ikon: "instagram", url: "https://instagram.com/hasbifx" },
    { ikon: "tiktok",    url: "https://tiktok.com/@biiifx" },
    { ikon: "telegram",  url: "https://t.me/hasbifx" },
    { ikon: "web",       url: "https://hasbifx.web.id" },
    { ikon: "email",       url: "mailto:hasbifxtrde@gmail.com" }
  ],

  // ikon = emoji apa saja. unggulan:true = kartu kuning menonjol + label miring
  link: [
    { ikon: "💬", judul: "Channel", deskripsi: "channel hasbifx trade", url: "https://t.me/hasbifxtrade", unggulan: true, label: "telegram" },
    { ikon: "💬", judul: "Grup Diskusi",       deskripsi: "Diskusi Publik", url: "https://t.me/+7Wh6dGZ1l8o1MTk1", unggulan: true, label: "telegram" }
  ],

  footer: "© 2026 hasbifx"
};
</script>
<!-- ============================================================ -->

<i class="sh sh1"></i><i class="sh sh2"></i><i class="sh sh3"></i><i class="sh sh4"></i>
<div class="marq" aria-hidden="true"><div class="track" id="mq"></div></div>

<main>
  <div class="top">
    <button class="soc" id="share" style="--i:8" aria-label="Bagikan halaman"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></button>
  </div>
  <header>
    <div class="av">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="cp" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0"/></defs><text><textPath id="bt" href="#cp" textLength="498" lengthAdjust="spacing"></textPath></text></svg>
      <div class="pic" id="pic"></div>
    </div>
    <h1 id="name"></h1>
    <p class="bio"><span id="bio"></span></p>
    <nav class="socs" id="soc" aria-label="Media sosial"></nav>
  </header>
  <section class="links" id="links"></section>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const C = CONFIG, $ = s => document.querySelector(s), R = document.documentElement.style;
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;

  // warna & judul
  R.setProperty('--bg', C.warna.latar); R.setProperty('--ink', C.warna.tinta);
  C.warna.aksen.forEach((c, i) => R.setProperty('--c' + (i + 1), c));
  document.querySelector('meta[name=theme-color]').content = C.warna.latar;
  document.title = C.nama + '';

  // ikon sosmed
  const I = {
    instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.4A4 4 0 1 1 12.6 8 4 4 0 0 1 16 11.4z"/><path d="M17.5 6.5h.01"/>',
    facebook:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    x:'<path d="M4 4l16 16M20 4L4 20"/>',
    youtube:'<path d="M22.5 6.4a2.8 2.8 0 0 0-1.9-2C18.9 4 12 4 12 4s-6.9 0-8.6.5a2.8 2.8 0 0 0-1.9 2A29 29 0 0 0 1 11.8a29 29 0 0 0 .5 5.3A2.8 2.8 0 0 0 3.4 19c1.7.5 8.6.5 8.6.5s6.9 0 8.6-.5a2.8 2.8 0 0 0 1.9-2 29 29 0 0 0 .5-5.2 29 29 0 0 0-.5-5.4z"/><path d="M9.8 15l5.7-3.2L9.8 8.5z"/>',
    tiktok:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    linkedin:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    telegram:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
    whatsapp:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
    email:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
    web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
  };
  const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${I[n] || I.web}</svg>`;

  // nama + centang
    $('#name').innerHTML = C.nama + (C.verified ? '<svg class="ver" viewBox="0 0 24 24" aria-label="Terverifikasi"><circle cx="12" cy="12" r="10.5" fill="red" stroke="var(--ink)" stroke-width="2"/><path d="M7.2 12.6l3.2 3.2 6.4-6.6" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '');

  // foto / inisial
  const pic = $('#pic');
  const inisial = () => { pic.innerHTML = '<div class="ini"></div>'; };
  if (C.foto) { const im = new Image(); im.alt = C.nama; im.onerror = inisial; im.src = C.foto; pic.append(im); } else inisial();

  // teks berputar
  const unit = C.badge.toUpperCase() + ' ★ ';
  $('#bt').textContent = unit.repeat(Math.max(1, Math.round(46 / unit.length)));

  // pita berjalan
  const m = C.marquee.map(t => `<span>${t} ✦</span>`).join('').repeat(3);
  $('#mq').innerHTML = m + m;

  // sosmed
  $('#soc').innerHTML = C.sosmed.map((s, i) => `<a class="soc" style="--i:${i}" href="${s.url}" target="_blank" rel="noopener" aria-label="${s.ikon}">${icon(s.ikon)}</a>`).join('');

  // link
  $('#links').innerHTML = C.link.map((l, i) => `
    <a class="link${l.unggulan ? ' hot' : ''}" style="--i:${i};--bc:${l.unggulan ? '#fff' : 'var(--c' + (i % 4 + 1) + ')'}" href="${l.url}" target="_blank" rel="noopener">
      <span class="ico">${l.ikon}</span>
      <span class="tx"><b>${l.judul}</b>${l.deskripsi ? `<small>${l.deskripsi}</small>` : ''}</span>
      <svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      ${l.unggulan && l.label ? `<i class="tag">${l.label}</i>` : ''}
    </a>`).join('');

  $('#foot').textContent = C.footer;

  // efek mengetik
  const el = $('#bio');
  if (still) el.textContent = C.bio[0];
  else {
    let p = 0, i = 0, del = false;
    (function tick() {
      const t = C.bio[p];
      el.textContent = t.slice(0, i);
      if (!del && i === t.length) { del = true; return setTimeout(tick, 1700); }
      if (del && i === 0) { del = false; p = (p + 1) % C.bio.length; }
      i += del ? -1 : 1;
      setTimeout(tick, del ? 35 : 75);
    })();
  }

  // bagikan
  const toast = $('#toast');
  $('#share').onclick = async () => {
    const d = { title: document.title, url: location.href };
    try {
      if (navigator.share) await navigator.share(d);
      else { await navigator.clipboard.writeText(d.url); toast.textContent = 'Link disalin!'; toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 2000); }
    } catch (e) {}
  };
})();
</script>
</body>
</html>
